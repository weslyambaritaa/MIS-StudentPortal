services:
  # =========================================================
  # STUDENT DATABASE - PostgreSQL
  # =========================================================
  student-db:
    image: postgres:18-alpine
    container_name: mis-student-db

    environment:
      POSTGRES_DB: ${STUDENT_DB_NAME}
      POSTGRES_USER: ${STUDENT_DB_USER}
      POSTGRES_PASSWORD: ${STUDENT_DB_PASSWORD}

    ports:
      - "${STUDENT_DB_PORT}:5432"

    volumes:
      - student-db-data:/var/lib/postgresql

    networks:
      - external-net

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 20


  # =========================================================
  # INTERNAL DATABASE - SQL Server
  # =========================================================
  internal-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mis-internal-db

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${INTERNAL_DB_SA_PASSWORD}

    ports:
      - "${INTERNAL_DB_PORT}:1433"

    volumes:
      - internal-db-data:/var/opt/mssql

    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -C -b || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

    networks:
      - internal-net


  # =========================================================
  # KEYCLOAK DATABASE - SQL Server
  # =========================================================
  keycloak-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mis-keycloak-db

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${KEYCLOAK_DB_SA_PASSWORD}

    ports:
      - "${KEYCLOAK_DB_PORT}:1433"

    volumes:
      - keycloak-db-data:/var/opt/mssql

    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -C -b || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

    networks:
      - auth-net


  # =========================================================
  # DATABASE BOOTSTRAP
  # Membuat database SQL Server jika belum tersedia
  # =========================================================
  database-bootstrap:
    build:
      context: .
      dockerfile: infrastructure/database-bootstrap/Dockerfile

    container_name: mis-database-bootstrap

    environment:
      INTERNAL_DB_HOST: internal-db
      INTERNAL_DB_PORT_INTERNAL: 1433
      INTERNAL_DB_NAME: ${INTERNAL_DB_NAME}
      INTERNAL_DB_SA_PASSWORD: ${INTERNAL_DB_SA_PASSWORD}

      KEYCLOAK_DB_HOST: keycloak-db
      KEYCLOAK_DB_PORT_INTERNAL: 1433
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME}
      KEYCLOAK_DB_SA_PASSWORD: ${KEYCLOAK_DB_SA_PASSWORD}

    depends_on:
      internal-db:
        condition: service_healthy
      keycloak-db:
        condition: service_healthy

    networks:
      - internal-net
      - auth-net

    restart: "no"


  # =========================================================
  # KEYCLOAK
  # =========================================================
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    container_name: mis-keycloak

    env_file:
      - ./keycloak/.env

    command:
      - start-dev
      - --import-realm

      # Development theme configuration
      - --spi-theme--cache-themes=false
      - --spi-theme--cache-templates=false
      - --spi-theme--static-max-age=-1

    ports:
      - "${KEYCLOAK_PORT}:8080"

    volumes:
      # Realm import
      - ./keycloak/realm:/opt/keycloak/data/import:ro

      # Custom login theme
      - ./keycloak/themes:/opt/keycloak/themes:ro

    depends_on:
      database-bootstrap:
        condition: service_completed_successfully

    networks:
      - auth-net


  # =========================================================
  # STUDENT API
  # External users:
  # student, pic, trainer
  # =========================================================
  student-api:
    build:
      context: .
      dockerfile: app/be/student-api/Dockerfile

    env_file:
      - ./app/be/student-api/.env

    container_name: mis-student-api

    environment:
      PORT: 4001
      NODE_ENV: development

      DB_HOST: student-db
      DB_PORT: 5432

    expose:
      - "4001"

    depends_on:
      student-db:
        condition: service_healthy

    networks:
      - external-net
      - event-net

    volumes:
      - ./app/be/student-api:/workspace/app/be/student-api
      - ./packages/shared-types:/workspace/packages/shared-types
      - student-api-node-modules:/workspace/node_modules


  # =========================================================
  # INTERNAL API
  # Internal users:
  # sales, admin, finance, management
  # =========================================================
  internal-api:
    build:
      context: .
      dockerfile: app/be/internal-api/Dockerfile

    env_file:
      - ./app/be/internal-api/.env

    container_name: mis-internal-api

    environment:
      PORT: 4002
      NODE_ENV: development

      DB_HOST: internal-db
      DB_PORT: 1433

      DB_ENCRYPT: "false"
      DB_TRUST_SERVER_CERTIFICATE: "true"

    expose:
      - "4002"

    depends_on:
      database-bootstrap:
        condition: service_completed_successfully

    networks:
      - internal-net
      - event-net

    volumes:
      - ./app/be/internal-api:/workspace/app/be/internal-api
      - ./packages/shared-types:/workspace/packages/shared-types
      - internal-api-node-modules:/workspace/node_modules


  # =========================================================
  # API GATEWAY
  #
  # http://api.localhost:4000
  # http://auth.localhost:4000
  # =========================================================
  api-gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile

    container_name: mis-api-gateway

    environment:
      PORT: 4000

      # Frontend origin
      CORS_ORIGIN: http://localhost:3000

      # Backend services
      STUDENT_API_URL: http://student-api:4001
      INTERNAL_API_URL: http://internal-api:4002

      # Keycloak internal Docker endpoint
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080

      # Public Keycloak host
      KEYCLOAK_PUBLIC_HOST: auth.localhost:4000

      # Public issuer contained inside JWT
      KEYCLOAK_ISSUER: >-
        http://auth.localhost:4000/realms/mis-student-portal

      # Internal JWKS URL
      KEYCLOAK_JWKS_INTERNAL_URL: >-
        http://keycloak:8080/realms/mis-student-portal/protocol/openid-connect/certs

      # JWT audience validation
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_CLIENT_ID}

      # Gateway -> backend protection
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET}

      # Rate limiting
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX: 100

      # Redis optional for now
      CACHE_ENABLED: "false"
      REDIS_URL: redis://redis:6379

    ports:
      - "${GATEWAY_PORT}:4000"

    depends_on:
      - keycloak
      - student-api
      - internal-api

    networks:
      edge-net:
        aliases:
          - auth.localhost
          - api.localhost

      auth-net:
      external-net:
      internal-net:
      gateway-infra-net:

    volumes:
      - ./gateway:/workspace/gateway
      - ./packages/shared-types:/workspace/packages/shared-types
      - gateway-node-modules:/workspace/node_modules


  # =========================================================
  # FRONTEND - Next.js
  #
  # keycloak-js
  # Authorization Code Flow
  # PKCE S256
  # =========================================================
  frontend:
    build:
      context: .
      dockerfile: app/fe/Dockerfile

    container_name: mis-frontend

    environment:
      # API Gateway
      NEXT_PUBLIC_API_BASE_URL: http://api.localhost:4000

      # Public Keycloak configuration
      NEXT_PUBLIC_KEYCLOAK_URL: http://auth.localhost:4000
      NEXT_PUBLIC_KEYCLOAK_REALM: mis-student-portal
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}

    ports:
      - "${FRONTEND_PORT}:3000"

    depends_on:
      - api-gateway

    networks:
      - edge-net

    volumes:
      - ./app/fe:/workspace/app/fe
      - ./packages/shared-types:/workspace/packages/shared-types
      - frontend-node-modules:/workspace/node_modules
      - frontend-next:/workspace/app/fe/.next


  # =========================================================
  # REDIS
  # Optional platform service
  # =========================================================
  redis:
    image: redis:8-alpine
    container_name: mis-redis

    profiles:
      - platform

    ports:
      - "${REDIS_PORT}:6379"

    networks:
      - gateway-infra-net

    volumes:
      - redis-data:/data


  # =========================================================
  # RABBITMQ
  # Optional platform service
  # =========================================================
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: mis-rabbitmq

    profiles:
      - platform

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}

    ports:
      - "${RABBITMQ_AMQP_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"

    networks:
      - event-net

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq


# =========================================================
# VOLUMES
# =========================================================
volumes:
  student-db-data:
  internal-db-data:
  keycloak-db-data:

  frontend-node-modules:
  frontend-next:

  gateway-node-modules:
  student-api-node-modules:
  internal-api-node-modules:

  redis-data:
  rabbitmq-data:


# =========================================================
# NETWORKS
# =========================================================
networks:
  # Frontend ↔ Gateway
  edge-net:

  # Gateway ↔ Keycloak
  auth-net:

  # Gateway ↔ Student API ↔ PostgreSQL
  external-net:

  # Gateway ↔ Internal API ↔ SQL Server
  internal-net:

  # Gateway ↔ Redis
  gateway-infra-net:

  # APIs ↔ RabbitMQ
  event-net:
