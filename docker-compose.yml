services:
  # =========================================================
  # STUDENT DATABASE - PostgreSQL
  # =========================================================
  student-db:
    image: postgres:18-alpine
    container_name: mis-student-db

    environment:
      POSTGRES_DB: ${STUDENT_DB_NAME}
      POSTGRES_USER: ${STUDENT_DB_USER}
      POSTGRES_PASSWORD: ${STUDENT_DB_PASSWORD}

    ports:
      - "${STUDENT_DB_PORT}:5432"

    volumes:
      - student-db-data:/var/lib/postgresql

    networks:
      - external-net

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 20


  # =========================================================
  # INTERNAL DATABASE - PostgreSQL
  # =========================================================
  internal-db:
    image: postgres:18-alpine
    container_name: mis-internal-db

    environment:
      POSTGRES_DB: ${INTERNAL_DB_NAME}
      POSTGRES_USER: ${INTERNAL_DB_USER:-mis_internal}
      POSTGRES_PASSWORD: ${INTERNAL_DB_PASSWORD}

    ports:
      - "${INTERNAL_DB_PORT}:5432"

    volumes:
      - internal-postgres-data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

    networks:
      - internal-net


  # =========================================================
  # KEYCLOAK DATABASE - PostgreSQL
  # =========================================================
  keycloak-db:
    image: postgres:18-alpine
    container_name: mis-keycloak-db

    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-mis_keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

    ports:
      - "${KEYCLOAK_DB_PORT}:5432"

    volumes:
      - keycloak-postgres-data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

    networks:
      - auth-net


  # =========================================================
  # =========================================================
  # KEYCLOAK
  # =========================================================
  keycloak:
    image: mis-keycloak-st01:26.7.3
    build:
      context: .
      dockerfile: keycloak/Dockerfile
    container_name: mis-keycloak

    env_file:
      - ./keycloak/.env

    command:
      - start-dev
      - --import-realm

      # Development theme configuration
      - --spi-theme--cache-themes=false
      - --spi-theme--cache-templates=false
      - --spi-theme--static-max-age=-1

    ports:
      - "${KEYCLOAK_PORT}:8080"

    volumes:
      # Realm import
      - ./keycloak/realm:/opt/keycloak/data/import:ro

      # Custom login theme
      - ./keycloak/themes:/opt/keycloak/themes:ro

    depends_on:
      keycloak-db:
        condition: service_healthy

    networks:
      - auth-net
      - keycloak-admin-net


  # =========================================================
  # STUDENT API
  # External users:
  # student, pic
  # =========================================================
  student-api:
    build:
      context: .
      dockerfile: app/be/student-api/Dockerfile

    env_file:
      - ./app/be/student-api/.env

    container_name: mis-student-api

    environment:
      PORT: 4001
      NODE_ENV: development

      DB_HOST: student-db
      DB_PORT: 5432

    expose:
      - "4001"

    depends_on:
      student-db:
        condition: service_healthy

    networks:
      - external-net
      - pic-service-net

    volumes:
      - ./app/be/student-api:/workspace/app/be/student-api
      - ./packages/shared-types:/workspace/packages/shared-types
      - student-api-node-modules:/workspace/node_modules


  # =========================================================
  # INTERNAL API
  # Internal users:
  # trainer, sales, admin, finance, management
  # =========================================================
  internal-api:
    build:
      context: .
      dockerfile: app/be/internal-api/Dockerfile

    env_file:
      - ./app/be/internal-api/.env

    container_name: mis-internal-api

    environment:
      PORT: 4002
      NODE_ENV: development

      DB_HOST: internal-db
      DB_PORT: 5432
      DB_USER: ${INTERNAL_DB_USER:-mis_internal}
      DB_PASSWORD: ${INTERNAL_DB_PASSWORD}
      DEVELOPER_SUPPORT_EMAIL: ${DEVELOPER_SUPPORT_EMAIL:-}
      STUDENT_API_URL: ${STUDENT_API_URL:-http://student-api:4001}
      KEYCLOAK_TRAINER_ACTIVATION_CLIENT_ID: ${KEYCLOAK_TRAINER_ACTIVATION_CLIENT_ID:-mis-student-portal-frontend}
      KEYCLOAK_TRAINER_ACTIVATION_REDIRECT_URI: ${KEYCLOAK_TRAINER_ACTIVATION_REDIRECT_URI:-http://localhost:3100/dashboard}

    expose:
      - "4002"

    depends_on:
      internal-db:
        condition: service_healthy

    networks:
      - internal-net
      - keycloak-admin-net
      - pic-service-net

    volumes:
      - ./app/be/internal-api:/workspace/app/be/internal-api
      - ./packages/shared-types:/workspace/packages/shared-types
      - internal-api-node-modules:/workspace/node_modules


  # =========================================================
  # SYSTEM HEALTH MONITOR
  # Runs independently from the monitored APIs and sends outage alerts.
  # =========================================================
  system-monitor:
    build:
      context: .
      dockerfile: app/be/internal-api/Dockerfile

    container_name: mis-system-monitor
    env_file:
      - ./app/be/internal-api/.env
    environment:
      NODE_ENV: development
      DEVELOPER_SUPPORT_EMAIL: ${DEVELOPER_SUPPORT_EMAIL:-}
      MONITOR_GATEWAY_HEALTH_URL: http://api-gateway:4000/health
      MONITOR_INTERNAL_HEALTH_URL: http://internal-api:4002/health
      MONITOR_STUDENT_HEALTH_URL: http://student-api:4001/health
      STUDENT_API_URL: ${STUDENT_API_URL:-http://student-api:4001}
      MONITOR_KEYCLOAK_HEALTH_URL: http://keycloak:8080/realms/mis-student-portal
      MONITOR_INTERVAL_MS: 30000
      MONITOR_FAILURE_THRESHOLD: 2
      MONITOR_STARTUP_GRACE_MS: 90000
    command: ["npm", "run", "monitor"]
    restart: unless-stopped
    networks:
      - internal-net
      - external-net
      - keycloak-admin-net


  # =========================================================
  # API GATEWAY
  #
  # http://api.localhost:4000
  # http://auth.localhost:4000
  # =========================================================
  api-gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile

    container_name: mis-api-gateway

    # Local development runs the TypeScript watcher; the image default is production.
    command: ["npm", "run", "dev"]

    environment:
      PORT: 4000

      # Frontend origin
      CORS_ORIGIN: http://localhost:3000,http://localhost:3001

      # Backend services
      STUDENT_API_URL: http://student-api:4001
      INTERNAL_API_URL: http://internal-api:4002

      # Keycloak internal Docker endpoint
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080

      # Public Keycloak host
      KEYCLOAK_PUBLIC_HOST: auth.localhost:4000

      # Public issuer contained inside JWT
      KEYCLOAK_ISSUER: >-
        http://auth.localhost:4000/realms/mis-student-portal

      # Internal JWKS URL
      KEYCLOAK_JWKS_INTERNAL_URL: >-
        http://keycloak:8080/realms/mis-student-portal/protocol/openid-connect/certs

      # JWT audience validation
      KEYCLOAK_AUDIENCES: ${KEYCLOAK_AUDIENCES:-mis-student-portal-frontend,student-portal-frontend}

      # Gateway -> backend protection
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET}

      # Rate limiting
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX: 100

    ports:
      - "${GATEWAY_PORT}:4000"

    depends_on:
      - keycloak
      - student-api
      - internal-api

    networks:
      edge-net:
        aliases:
          - auth.localhost
          - api.localhost

      auth-net:
      external-net:
      internal-net:

    volumes:
      - ./gateway:/workspace/gateway
      - ./packages/shared-types:/workspace/packages/shared-types
      - gateway-node-modules:/workspace/node_modules


  # =========================================================
  # FRONTEND - Next.js
  #
  # keycloak-js
  # Authorization Code Flow
  # PKCE S256
  # =========================================================
  frontend:
    build:
      context: .
      dockerfile: app/fe/Dockerfile

    container_name: mis-frontend

    command: ["npm", "run", "dev"]

    environment:
      # API Gateway
      NEXT_PUBLIC_API_BASE_URL: http://api.localhost:4000

      # Public Keycloak configuration
      NEXT_PUBLIC_KEYCLOAK_URL: http://auth.localhost:4000
      NEXT_PUBLIC_KEYCLOAK_REALM: mis-student-portal
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}

    ports:
      - "${FRONTEND_PORT}:3000"

    depends_on:
      - api-gateway

    networks:
      - edge-net

    volumes:
      - ./app/fe:/workspace/app/fe
      - ./packages/shared-types:/workspace/packages/shared-types
      - ./packages/config:/workspace/packages/config
      - ./packages/auth:/workspace/packages/auth
      - ./packages/api-client:/workspace/packages/api-client
      - ./packages/ui:/workspace/packages/ui

  student-frontend:
    build:
      context: .
      dockerfile: app/student-fe/Dockerfile
    container_name: mis-student-frontend
    command: ["npm", "run", "dev"]
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://api.localhost:4000
      NEXT_PUBLIC_KEYCLOAK_URL: http://auth.localhost:4000
      NEXT_PUBLIC_KEYCLOAK_REALM: mis-student-portal
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${STUDENT_KEYCLOAK_CLIENT_ID:-student-portal-frontend}
    ports:
      - "${STUDENT_FRONTEND_PORT:-3001}:3000"
    depends_on:
      - api-gateway
    networks:
      - edge-net
    volumes:
      - ./app/student-fe:/workspace/app/student-fe
      - ./packages/shared-types:/workspace/packages/shared-types
      - ./packages/auth:/workspace/packages/auth
      - ./packages/api-client:/workspace/packages/api-client
      - ./packages/ui:/workspace/packages/ui


# =========================================================
# VOLUMES
# =========================================================
volumes:
  student-db-data:
  internal-postgres-data:
  keycloak-postgres-data:


  gateway-node-modules:
  student-api-node-modules:
  internal-api-node-modules:



# =========================================================
# NETWORKS
# =========================================================
networks:
  # Frontend ↔ Gateway
  edge-net:

  # Gateway ↔ Keycloak
  auth-net:

  # Gateway ↔ Student API ↔ PostgreSQL
  external-net:

  # Gateway ↔ Internal API ↔ PostgreSQL
  internal-net:

  # Internal API reaches Keycloak Admin API without joining the Keycloak DB network.
  keycloak-admin-net:

  # Server-to-server PIC calls; isolated from the public gateway networks.
  pic-service-net:
    internal: true
