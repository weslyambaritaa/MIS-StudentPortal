x-migrate-command: &migrate-command
  - sh
  - -c
  - |
    cat > /tmp/mig.cjs <<'EOF'
    const c = {
      username: process.env.MIG_USER,
      password: process.env.MIG_PASS,
      database: process.env.MIG_DB,
      host: process.env.DB_HOST,
      port: Number(process.env.DB_PORT || 5432),
      dialect: 'postgres'
    };
    module.exports = { development: c, production: c, test: c };
    EOF
    cd "$$MIG_DIR" && npx sequelize-cli db:migrate --config /tmp/mig.cjs
 
services:
  # ---------------------------------------------------------
  # DATABASES
  # ---------------------------------------------------------
  student-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${STUDENT_DB_NAME}
      POSTGRES_USER: ${STUDENT_DB_USER}
      POSTGRES_PASSWORD: ${STUDENT_DB_PASSWORD}
    volumes:
      - student-db-data:/var/lib/postgresql
    networks:
      - external-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
 
  internal-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${INTERNAL_DB_NAME}
      POSTGRES_USER: ${INTERNAL_DB_USER:-mis_internal}
      POSTGRES_PASSWORD: ${INTERNAL_DB_PASSWORD}
    volumes:
      - internal-postgres-data:/var/lib/postgresql
    networks:
      - internal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
 
  keycloak-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-mis_keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql
    networks:
      - auth-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
 
  # ---------------------------------------------------------
  # KEYCLOAK (publik lewat api-gateway di https://${AUTH_DOMAIN})
  # Untuk startup lebih cepat: pakai Dockerfile.keycloak.prod lalu
  # tambahkan "--optimized" setelah "start".
  # ---------------------------------------------------------
  keycloak:
    image: mis-keycloak-st01:26.7.3
    build:
      context: .
      dockerfile: keycloak/Dockerfile
    env_file:
      - ../files/keycloak.env
    environment:
      KC_HOSTNAME: https://${AUTH_DOMAIN}
      KC_HOSTNAME_ADMIN: https://${AUTH_DOMAIN}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    command:
      - start
      - --import-realm
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - auth-net
      - keycloak-admin-net
    restart: unless-stopped
 
  # ---------------------------------------------------------
  # MIGRASI DATABASE (sekali jalan tiap deploy, hanya db:migrate)
  # ---------------------------------------------------------
  migrate-internal:
    image: mis-internal-api:prod
    build:
      context: .
      dockerfile: app/be/internal-api/Dockerfile
    environment:
      NODE_ENV: production
      MIG_DIR: /workspace/app/be/internal-api
      DB_HOST: internal-db
      DB_PORT: 5432
      MIG_DB: ${INTERNAL_DB_NAME}
      MIG_USER: ${INTERNAL_DB_USER:-mis_internal}
      MIG_PASS: ${INTERNAL_DB_PASSWORD}
    command: *migrate-command
    depends_on:
      internal-db:
        condition: service_healthy
    networks:
      - internal-net
    restart: "no"
 
  migrate-student:
    image: mis-student-api:prod
    build:
      context: .
      dockerfile: app/be/student-api/Dockerfile
    environment:
      NODE_ENV: production
      MIG_DIR: /workspace/app/be/student-api
      DB_HOST: student-db
      DB_PORT: 5432
      MIG_DB: ${STUDENT_DB_NAME}
      MIG_USER: ${STUDENT_DB_USER}
      MIG_PASS: ${STUDENT_DB_PASSWORD}
    command: *migrate-command
    depends_on:
      student-db:
        condition: service_healthy
    networks:
      - external-net
    restart: "no"
 
  # ---------------------------------------------------------
  # STUDENT API
  # ---------------------------------------------------------
  student-api:
    image: mis-student-api:prod
    build:
      context: .
      dockerfile: app/be/student-api/Dockerfile
    env_file:
      - ../files/student-api.env
    environment:
      PORT: 4001
      NODE_ENV: production
      DB_HOST: student-db
      DB_PORT: 5432
    expose:
      - "4001"
    depends_on:
      student-db:
        condition: service_healthy
      migrate-student:
        condition: service_completed_successfully
    networks:
      - external-net
    restart: unless-stopped
 
  # ---------------------------------------------------------
  # INTERNAL API
  # ---------------------------------------------------------
  internal-api:
    image: mis-internal-api:prod
    build:
      context: .
      dockerfile: app/be/internal-api/Dockerfile
    env_file:
      - ../files/internal-api.env
    environment:
      PORT: 4002
      NODE_ENV: production
      DB_HOST: internal-db
      DB_PORT: 5432
      DB_USER: ${INTERNAL_DB_USER:-mis_internal}
      DB_PASSWORD: ${INTERNAL_DB_PASSWORD}
      DEVELOPER_SUPPORT_EMAIL: ${DEVELOPER_SUPPORT_EMAIL:-}
    expose:
      - "4002"
    depends_on:
      internal-db:
        condition: service_healthy
      migrate-internal:
        condition: service_completed_successfully
    networks:
      - internal-net
      - keycloak-admin-net
    restart: unless-stopped
 
  # ---------------------------------------------------------
  # SYSTEM HEALTH MONITOR (image sama dengan internal-api)
  # ---------------------------------------------------------
  system-monitor:
    image: mis-internal-api:prod
    env_file:
      - ../files/internal-api.env
    environment:
      NODE_ENV: production
      DEVELOPER_SUPPORT_EMAIL: ${DEVELOPER_SUPPORT_EMAIL:-}
      MONITOR_GATEWAY_HEALTH_URL: http://api-gateway:4000/health
      MONITOR_INTERNAL_HEALTH_URL: http://internal-api:4002/health
      MONITOR_STUDENT_HEALTH_URL: http://student-api:4001/health
      MONITOR_KEYCLOAK_HEALTH_URL: http://keycloak:8080/realms/mis-student-portal
      MONITOR_INTERVAL_MS: 30000
      MONITOR_FAILURE_THRESHOLD: 2
      MONITOR_STARTUP_GRACE_MS: 90000
    command: ["npm", "run", "monitor"]
    depends_on:
      internal-api:
        condition: service_started
    restart: unless-stopped
    networks:
      - internal-net
      - external-net
      - keycloak-admin-net
 
  # ---------------------------------------------------------
  # API GATEWAY (production image; no source bind mounts)
  # Domain di Dokploy: API_DOMAIN dan AUTH_DOMAIN -> port 4000
  # ---------------------------------------------------------
  api-gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      PORT: 4000
      CORS_ORIGIN: https://${APP_DOMAIN}
      STUDENT_API_URL: http://student-api:4001
      INTERNAL_API_URL: http://internal-api:4002
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_HOST: ${AUTH_DOMAIN}
      KEYCLOAK_ISSUER: https://${AUTH_DOMAIN}/realms/mis-student-portal
      KEYCLOAK_JWKS_INTERNAL_URL: http://keycloak:8080/realms/mis-student-portal/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_CLIENT_ID}
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET}
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX: 100
    expose:
      - "4000"
    depends_on:
      - keycloak
      - student-api
      - internal-api
    labels:
      - traefik.docker.network=dokploy-network
    networks:
      - dokploy-network
      - edge-net
      - auth-net
      - external-net
      - internal-net
    restart: unless-stopped
 
  # ---------------------------------------------------------
  # FRONTEND - Next.js (produksi: tanpa volume)
  # Domain di Dokploy: APP_DOMAIN -> port 3000
  # ---------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: app/fe/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: https://${API_DOMAIN}
        NEXT_PUBLIC_KEYCLOAK_URL: https://${AUTH_DOMAIN}
        NEXT_PUBLIC_KEYCLOAK_REALM: mis-student-portal
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
    environment:
      NODE_ENV: production
    expose:
      - "3000"
    depends_on:
      - api-gateway
    labels:
      - traefik.docker.network=dokploy-network
    networks:
      - dokploy-network
      - edge-net
    restart: unless-stopped
 
 
volumes:
  student-db-data:
  internal-postgres-data:
  keycloak-postgres-data:
networks:
  dokploy-network:
    external: true
  edge-net:
  auth-net:
  external-net:
  internal-net:
  keycloak-admin-net:
